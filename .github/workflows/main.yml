name: Build VST3 + Installer (Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Collect VST3 bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $v = Get-ChildItem -Path build -Recurse -Directory -Filter "VoidClip.vst3" |
               Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $v) { throw "VoidClip.vst3 nicht gefunden" }
          Copy-Item $v.FullName -Destination "dist/VoidClip.vst3" -Recurse
          Get-ChildItem -Recurse dist | Select-Object FullName

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DSourceDir=$PWD\dist\VoidClip.vst3" "Installer\VoidClip.iss"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoidClip-Windows
          path: |
            dist/VoidClip-Setup-*.exe
            dist/VoidClip.vst3

      - name: Release (bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VoidClip-Setup-*.exe
